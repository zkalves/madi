<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Tile -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.3" />

  <!-- Background Grid Dots -->
  <g fill="#475569" opacity="0.4">
    <circle cx="100" cy="100" r="4" />
    <circle cx="180" cy="100" r="4" />
    <circle cx="260" cy="100" r="4" />
    <circle cx="340" cy="100" r="4" />
    <circle cx="420" cy="100" r="4" />
    <circle cx="100" cy="180" r="4" />
    <circle cx="420" cy="180" r="4" />
    <circle cx="100" cy="260" r="4" />
    <circle cx="420" cy="260" r="4" />
    <circle cx="100" cy="340" r="4" />
    <circle cx="180" cy="340" r="4" />
    <circle cx="420" cy="340" r="4" />
    <circle cx="100" cy="420" r="4" />
    <circle cx="180" cy="420" r="4" />
    <circle cx="260" cy="420" r="4" />
    <circle cx="340" cy="420" r="4" />
    <circle cx="420" cy="420" r="4" />
  </g>

  <!-- Central Schematic Node Block -->
  <rect x="200" y="160" width="160" height="150" rx="16" fill="url(#boxGrad)" stroke="#38BDF8" stroke-width="5" />
  <rect x="225" y="190" width="110" height="20" rx="6" fill="#0EA5E9" opacity="0.7" />
  <rect x="225" y="225" width="80" height="14" rx="4" fill="#64748B" />
  <rect x="225" y="250" width="95" height="14" rx="4" fill="#64748B" />

  <!-- Secondary Node Block -->
  <rect x="80" y="290" width="100" height="90" rx="12" fill="url(#boxGrad)" stroke="#64748B" stroke-width="4" stroke-dasharray="8,6" />

  <!-- Orthogonal Routing Net 1 (Cyan with glow) -->
  <path d="M 130 140 L 130 220 L 200 220" fill="none" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 130 140 L 130 220 L 200 220" fill="none" stroke="#E0F2FE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Orthogonal Routing Net 2 (Main Route bypassing block to East) -->
  <path d="M 360 220 L 430 220 L 430 360 L 260 360 L 260 410" fill="none" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 360 220 L 430 220 L 430 360 L 260 360 L 260 410" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Wire Crossing Bridge (Loop Jump over Net 2) -->
  <path d="M 310 320 L 310 350 A 10 10 0 0 1 310 370 L 310 400" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />

  <!-- Ports / Terminals -->
  <circle cx="130" cy="140" r="10" fill="#22C55E" stroke="#FFFFFF" stroke-width="3" />
  <circle cx="200" cy="220" r="8" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="360" cy="220" r="8" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="260" cy="410" r="10" fill="#EF4444" stroke="#FFFFFF" stroke-width="3" />

  <!-- Destination Arrow -->
  <polygon points="260,430 248,405 272,405" fill="#EF4444" />
</svg>
