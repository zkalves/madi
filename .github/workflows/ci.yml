name: Madí CI & Packaging

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # 1. Linux Build & Test (Unit & Smoke Verification)
  # ============================================================================
  test-linux:
    name: Test (Ubuntu Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git \
            qt6-base-dev qt6-svg-dev libgl1-mesa-dev libxkbcommon-dev \
            zlib1g-dev librsvg2-bin imagemagick

      - name: Configure CMake
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build all targets
        run: cmake --build build -j$(nproc)

      - name: Run CTest test suite
        run: ctest --test-dir build --output-on-failure

      - name: Test Headless GUI Launch
        run: |
          QT_QPA_PLATFORM=offscreen ./build/madi-gui --self-test || true
          ./build/madi --help || true

  # ============================================================================
  # 2. Native Linux Packages: DEB, RPM, and Tarball (CPack)
  # ============================================================================
  package-deb-rpm:
    name: Package (DEB, RPM, Tarball)
    needs: test-linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build & packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build rpm dpkg-dev \
            qt6-base-dev qt6-svg-dev libgl1-mesa-dev libxkbcommon-dev \
            zlib1g-dev librsvg2-bin imagemagick

      - name: Configure and build
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)

      - name: Generate DEB, RPM, and TGZ Packages via CPack
        run: |
          cd build
          cpack -G "DEB;RPM;TGZ"

      - name: Test Install DEB Package
        run: |
          sudo dpkg -i build/madi-*.deb
          madi --help || true
          QT_QPA_PLATFORM=offscreen madi-gui --help || true

      - name: Upload DEB & RPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-packages
          path: |
            build/madi-*.deb
            build/madi-*.rpm
            build/madi-*.tar.gz

  # ============================================================================
  # 3. Standalone AppImage Bundle
  # ============================================================================
  package-appimage:
    name: Package (AppImage)
    needs: test-linux
    # Ubuntu 22.04 base ensures compatibility across all modern Linux distributions
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git wget file \
            qt6-base-dev qt6-svg-dev libgl1-mesa-dev libxkbcommon-dev \
            zlib1g-dev librsvg2-bin imagemagick

      - name: Configure and build
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)

      - name: Build AppImage
        run: |
          chmod +x packaging/appimage/build-appimage.sh
          ./packaging/appimage/build-appimage.sh

      - name: Verify AppImage Execution (Headless)
        run: |
          chmod +x dist/*.AppImage || true
          ./dist/*.AppImage --appimage-extract-and-run --help || true

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: madi-appimage
          path: dist/*.AppImage

  # ============================================================================
  # 4. Containers: Docker & Podman OCI Build & Test
  # ============================================================================
  container-build:
    name: Containers (Docker & Podman)
    needs: test-linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman

      - name: Build OCI Image with Docker
        run: |
          docker build -t madi:docker-test -f packaging/docker/Dockerfile .

      - name: Test Docker Container Execution
        run: |
          docker run --rm madi:docker-test madi --help || true
          docker run --rm -e QT_QPA_PLATFORM=offscreen madi:docker-test madi-gui --help || true

      - name: Build OCI Image with Podman
        run: |
          podman build -t madi:podman-test -f packaging/docker/Dockerfile .

      - name: Test Podman Container Execution
        run: |
          podman run --rm madi:podman-test madi --help || true

  # ============================================================================
  # 5. MS Windows Build & Packaging (MSVC, windeployqt, NSIS & ZIP)
  # ============================================================================
  windows-build-and-package:
    name: Build & Package (MS Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6.8 (MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtsvg'

      - name: Set up Ninja
        uses: ashutoshvarma/setup-ninja@v1

      - name: Configure CMake (MSVC)
        run: |
          cmake -B build -S . -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$((Get-Location).Path)/install_dir"

      - name: Build Targets
        run: cmake --build build --config Release

      - name: Run Smoke Tests
        run: ctest --test-dir build --output-on-failure

      - name: Install into Staging Directory
        run: cmake --install build --config Release

      - name: Run windeployqt on Executable
        run: |
          windeployqt.exe `
            --release `
            --no-compiler-runtime `
            --no-translations `
            --plugindir install_dir/bin `
            install_dir/bin/madi-gui.exe

      - name: Package with CPack (NSIS & ZIP)
        run: |
          cd build
          cpack -G "ZIP;NSIS" -C Release

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            build/madi-*.zip
            build/madi-*.exe

  # ============================================================================
  # 6. Publish GitHub Release (on Tag Push: v*)
  # ============================================================================
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-deb-rpm, package-appimage, container-build, windows-build-and-package]
    runs-on: ubuntu-latest
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-native-packages/*
            artifacts/madi-appimage/*
            artifacts/windows-packages/*
          draft: false
          prerelease: false
          generate_release_notes: true
